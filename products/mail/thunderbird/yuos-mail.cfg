// Yu OS Mail desktop defaults.
if (typeof Components !== "undefined" &&
    Services.appinfo.version.split(".")[0] === "140" &&
    getPref("yuos.mail.chrome.enabled")) {
  defaultPref("mail.uifontsize", 13);
  defaultPref("mail.fixed_width_messages", false);
  defaultPref("font.name.sans-serif.x-western", "Noto Sans");
  defaultPref("font.name.sans-serif.x-unicode", "Noto Sans");
  defaultPref("font.name.sans-serif.zh-CN", "Noto Sans CJK SC");

  try {
    const file = Services.dirsvc.get("GreD", Ci.nsIFile);
    file.append("distribution");
    file.append("yuos-mail.css");
    if (!file.isFile()) {
      throw new Error("Missing packaged Yu OS Mail stylesheet");
    }
    const uri = Services.io.newFileURI(file);
    const styles = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
    if (!styles.sheetRegistered(uri, styles.USER_SHEET)) {
      styles.loadAndRegisterSheet(uri, styles.USER_SHEET);
    }
  } catch (error) {
    Components.utils.reportError(error);
  }

  defaultPref("msgcompose.font_face", "Noto Sans");

  const zh = () => Services.locale.appLocaleAsBCP47.startsWith("zh");
  const T = key => ({
    write: ["写信", "Write"], search: ["搜索邮件", "Search mail"],
    sent: ["已发送", "Sent"], archive: ["归档", "Archive"],
  })[key][zh() ? 0 : 1];

  // Minimal default layout; a saved layout other than an earlier Yu OS default wins.
  Services.obs.addObserver(function yuMailToolbars() {
    Services.obs.removeObserver(yuMailToolbars, "final-ui-startup");
    const MAIN = "chrome://messenger/content/messenger.xhtml";
    const COMPOSE = "chrome://messenger/content/messengercompose/messengercompose.xhtml";
    const earlier = [
      JSON.stringify({
        mail: ["write-message", "get-messages", "delete", "archive", "junk", "move-to",
               "reply", "reply-all", "forward-inline", "mark-as", "tag-message", "spacer", "search-bar"],
      }),
      "button-send,separator,button-attach,button-save,spellingButton,button-contacts,spring,button-encryption,button-encryption-options",
      "button-send,separator,button-attach,button-save,spellingButton,button-address,button-contacts,spring,button-encryption,button-encryption-options",
    ];
    const defaults = [
      [MAIN, "unifiedToolbar", "state", JSON.stringify({ mail: ["write-message", "spacer", "search-bar", "spacer"] })],
      [MAIN, "spacesToolbar", "hidden", "true"],
      [COMPOSE, "composeToolbar2", "currentset", "button-send,button-attach,spring"],
    ];
    for (const [doc, id, attr, value] of defaults) {
      if (!Services.xulStore.hasValue(doc, id, attr) ||
          earlier.includes(Services.xulStore.getValue(doc, id, attr))) {
        Services.xulStore.setValue(doc, id, attr, value);
      }
    }
  }, "final-ui-startup");

  Services.obs.addObserver(doc => {
    const win = doc.defaultView;
    const uri = doc.documentURI || "";
    if (uri === "chrome://messenger/content/messenger.xhtml") {
      win.addEventListener("DOMContentLoaded", () => {
        const search = doc.getElementById("searchBarItemTemplate")?.content.querySelector("[slot=placeholder]");
        if (search) {
          search.removeAttribute("data-l10n-id");
          search.classList.remove("kbd-container");
          search.textContent = T("search");
        }
        doc.getElementById("writeMessageTemplate")?.content.firstElementChild.setAttribute("label", T("write"));
        // Spaces live in the app menu instead of a permanent side bar.
        const view = doc.getElementById("appMenu-mainView");
        view?.addEventListener("ViewShowing", () => {
          const before = doc.getElementById("appmenu_preferences");
          doc.querySelectorAll(".yu-space-item").forEach(item => item.remove());
          for (const space of win.gSpacesToolbar?.spaces ?? []) {
            if (space.name === "mail" || space.name === "settings" || !space.button) {
              continue;
            }
            const item = doc.createXULElement("toolbarbutton");
            item.className = "subviewbutton yu-space-item";
            item.setAttribute("label", space.button.title || space.button.getAttribute("aria-label") || space.name);
            item.addEventListener("command", () => {
              win.PanelUI.hide();
              win.gSpacesToolbar.openSpace(win.document.getElementById("tabmail"), space);
            });
            before.before(item);
          }
        });
      }, { once: true });
    } else if (uri.startsWith("about:3pane")) {
      win.addEventListener("DOMContentLoaded", () => {
        const header = win.threadPaneHeader;
        const count = doc.createElement("span");
        count.className = "thread-pane-count-info yu-count";
        doc.getElementById("threadPaneFolderCount").after(count);
        const update = header.updateMessageCount;
        header.updateMessageCount = function (value) {
          update.call(this, value);
          count.textContent = value;
        };
        // Like Outlook, an opened folder shows its newest message.
        win.addEventListener("folderURIChanged", () => {
          Services.tm.dispatchToMainThread(() => {
            const tree = doc.getElementById("threadTree");
            if (win.gDBView?.rowCount && tree.selectedIndex < 0) {
              tree.selectedIndex = 0;
            }
          });
        });
        win.customElements.whenDefined("folder-tree-row").then(Row => {
          const names = { sent: ["已发送消息", "Sent"], archive: ["归档", "Archives"] };
          const setName = Row.prototype._setName;
          Row.prototype._setName = function () {
            setName.call(this);
            const type = this.dataset.folderType;
            if (this._nameStyle === "folder" && names[type]?.includes(this.name)) {
              this.name = T(type);
            }
          };
          const setType = Row.prototype.setFolderTypeFromFolder;
          Row.prototype.setFolderTypeFromFolder = function (folder) {
            setType.call(this, folder);
            if (this._folderName) {
              this._setName();
            }
          };
          for (const row of doc.querySelectorAll('li[is="folder-tree-row"]')) {
            row._setName();
          }
        });
        win.customElements.whenDefined("thread-card").then(Card => {
          const density = win.threadPane.densityChange;
          win.threadPane.densityChange = async function () {
            await density.call(this);
            Card.ROW_HEIGHT = 78;
          };
          Card.ROW_HEIGHT = 78;
        });
      }, { once: true });
    } else if (uri.startsWith("about:message")) {
      win.addEventListener("DOMContentLoaded", () => {
        // Actions removed from the header stay in its More menu.
        const popup = doc.getElementById("otherActionsPopup");
        const first = popup?.firstElementChild;
        const commands = {
          "mailContext-replyAll": "cmd_replyall",
          "mailContext-markAsJunk": "cmd_markAsJunk",
          "mailContext-markFlagged": "cmd_markAsFlagged",
        };
        for (const id of [...Object.keys(commands), "mailContext-moveMenu"]) {
          const item = doc.getElementById(id)?.cloneNode(true);
          if (!item) {
            continue;
          }
          item.id = "yu-" + id;
          item.querySelectorAll("[id]").forEach(child => (child.id = "yu-" + child.id));
          item.addEventListener("command", event => {
            event.stopPropagation();
            if (commands[id]) {
              win.commandController.doCommand(commands[id]);
            } else if (event.target._folder) {
              win.commandController.doCommand("cmd_moveMessage", event.target._folder);
            }
          });
          popup.insertBefore(item, first);
        }
        popup?.insertBefore(doc.createXULElement("menuseparator"), first);
        popup?.addEventListener("popupshowing", event => {
          if (event.target === popup) {
            const flagged = win.gMessage?.isFlagged;
            doc.getElementById("yu-mailContext-markFlagged")?.setAttribute("checked", !!flagged);
          }
        });
        // The message body sizes to its content so attachments follow it.
        const pane = doc.getElementById("messagepane");
        const fit = (tries = 40) => {
          const page = pane?.contentDocument;
          if (page?.readyState !== "complete") {
            if (tries) {
              win.setTimeout(fit, 50, tries - 1);
            }
            return;
          }
          const body = page.body;
          pane.removeAttribute("flex");
          const style = page.defaultView.getComputedStyle(body);
          const height = body.getBoundingClientRect().height + parseFloat(style.marginTop) + parseFloat(style.marginBottom);
          pane.style.height = Math.min(Math.ceil(height), pane.parentElement.clientHeight) + "px";
        };
        win.addEventListener("MsgLoaded", () => win.setTimeout(fit, 0));
        win.addEventListener("resize", () => fit(0));
      }, { once: true });
    }
  }, "document-element-inserted");

  // No account yet: the window is the account setup page with a short title.
  Services.obs.addObserver(doc => {
    const uri = doc.documentURI || "";
    if (uri === "chrome://messenger/content/messenger.xhtml" || uri.startsWith("about:3pane")) {
      const { MailServices } = ChromeUtils.importESModule("resource:///modules/MailServices.sys.mjs");
      if (MailServices.accounts.accounts.length) {
        return;
      }
      const root = doc.documentElement;
      root.setAttribute("yu-no-account", "true");
      const clear = event => {
        if (!event || (!uri.startsWith("about:3pane") &&
            event.detail?.tabInfo?.browser?.currentURI?.spec === "about:accountsetup")) {
          root.removeAttribute("yu-no-account");
          doc.defaultView.removeEventListener("TabClose", clear, true);
          // Removing inside onServerLoaded mutates the array Thunderbird is iterating.
          Services.tm.dispatchToMainThread(() => MailServices.accounts.removeIncomingServerListener(listener));
        }
      };
      const listener = { onServerLoaded: () => clear(), onServerUnloaded() {}, onServerChanged() {} };
      MailServices.accounts.addIncomingServerListener(listener);
      doc.defaultView.addEventListener("TabClose", clear, true);
    } else if (uri.startsWith("about:accountsetup")) {
      doc.defaultView.addEventListener("DOMContentLoaded", () => {
        const title = doc.getElementById("accountSetupTitle");
        if (title?.getAttribute("data-l10n-id") === "account-setup-title") {
          doc.l10n.setAttributes(title, "account-setup-tab-title");
        }
      }, { once: true });
    }
  }, "document-element-inserted");

  // Cards show Thunderbird's stored message preview as a third line.
  Services.obs.addObserver(doc => {
    if (!doc.documentURI?.startsWith("about:3pane")) {
      return;
    }
    doc.defaultView.customElements.whenDefined("thread-card").then(Card => {
      const fillRow = Card.prototype._fillRow;
      Card.prototype._fillRow = function () {
        fillRow.call(this);
        let line = this.querySelector(".yu-mail-preview");
        if (!line) {
          line = doc.createElement("span");
          line.className = "yu-mail-preview";
          this.querySelector(".thread-card-dynamic-row").append(line);
        }
        line.textContent = "";
        if (this.dataset.properties.split(" ").includes("dummy")) {
          return;
        }
        try {
          const hdr = this.view.getMsgHdrAt(this._index);
          if (!hdr.getStringProperty("preview") &&
              (hdr.folder.server.type !== "imap" || hdr.flags & Ci.nsMsgMessageFlags.Offline)) {
            hdr.folder.fetchMsgPreviewText([hdr.messageKey], null);
          }
          line.textContent = hdr.getStringProperty("preview");
        } catch (error) {}
      };
    });
  }, "document-element-inserted");
}
