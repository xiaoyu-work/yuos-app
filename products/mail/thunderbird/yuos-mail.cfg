// Yu OS Mail desktop defaults.
if (typeof Components !== "undefined" &&
    Services.appinfo.version.split(".")[0] === "140" &&
    getPref("yuos.mail.chrome.enabled")) {
  defaultPref("mail.uifontsize", 13);
  defaultPref("mail.fixed_width_messages", false);
  defaultPref("font.name.sans-serif.x-western", "Noto Sans");
  defaultPref("font.name.sans-serif.x-unicode", "Noto Sans");
  defaultPref("font.name.sans-serif.zh-CN", "Noto Sans CJK SC");

  try {
    const file = Services.dirsvc.get("GreD", Ci.nsIFile);
    file.append("distribution");
    file.append("yuos-mail.css");
    if (!file.isFile()) {
      throw new Error("Missing packaged Yu OS Mail stylesheet");
    }
    const uri = Services.io.newFileURI(file);
    const styles = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
    if (!styles.sheetRegistered(uri, styles.USER_SHEET)) {
      styles.loadAndRegisterSheet(uri, styles.USER_SHEET);
    }
  } catch (error) {
    Components.utils.reportError(error);
  }

  // Outlook-like default command order; saved user customizations win.
  Services.obs.addObserver(function yuMailToolbars() {
    Services.obs.removeObserver(yuMailToolbars, "final-ui-startup");
    const defaults = [
      ["chrome://messenger/content/messenger.xhtml", "unifiedToolbar", "state", JSON.stringify({
        mail: ["write-message", "get-messages", "delete", "archive", "junk", "move-to",
               "reply", "reply-all", "forward-inline", "mark-as", "tag-message", "spacer", "search-bar"],
      })],
      ["chrome://messenger/content/messengercompose/messengercompose.xhtml", "composeToolbar2", "currentset",
       "button-send,separator,button-attach,button-save,spellingButton,button-contacts,spring,button-encryption,button-encryption-options"],
    ];
    for (const [doc, id, attr, value] of defaults) {
      if (!Services.xulStore.hasValue(doc, id, attr)) {
        Services.xulStore.setValue(doc, id, attr, value);
      }
    }
  }, "final-ui-startup");

  // No account yet: the window is the account setup page with a short title.
  Services.obs.addObserver(doc => {
    const uri = doc.documentURI || "";
    if (uri === "chrome://messenger/content/messenger.xhtml" || uri.startsWith("about:3pane")) {
      const { MailServices } = ChromeUtils.importESModule("resource:///modules/MailServices.sys.mjs");
      if (MailServices.accounts.accounts.length) {
        return;
      }
      const root = doc.documentElement;
      root.setAttribute("yu-no-account", "true");
      const clear = event => {
        if (!event || (!uri.startsWith("about:3pane") &&
            event.detail?.tabInfo?.browser?.currentURI?.spec === "about:accountsetup")) {
          root.removeAttribute("yu-no-account");
          doc.defaultView.removeEventListener("TabClose", clear, true);
          // Removing inside onServerLoaded mutates the array Thunderbird is iterating.
          Services.tm.dispatchToMainThread(() => MailServices.accounts.removeIncomingServerListener(listener));
        }
      };
      const listener = { onServerLoaded: () => clear(), onServerUnloaded() {}, onServerChanged() {} };
      MailServices.accounts.addIncomingServerListener(listener);
      doc.defaultView.addEventListener("TabClose", clear, true);
    } else if (uri.startsWith("about:accountsetup")) {
      doc.defaultView.addEventListener("DOMContentLoaded", () => {
        const title = doc.getElementById("accountSetupTitle");
        if (title?.getAttribute("data-l10n-id") === "account-setup-title") {
          doc.l10n.setAttributes(title, "account-setup-tab-title");
        }
      }, { once: true });
    }
  }, "document-element-inserted");

  // Cards show Thunderbird's stored message preview as a third line.
  Services.obs.addObserver(doc => {
    if (!doc.documentURI?.startsWith("about:3pane")) {
      return;
    }
    doc.defaultView.customElements.whenDefined("thread-card").then(Card => {
      const fillRow = Card.prototype._fillRow;
      Card.prototype._fillRow = function () {
        fillRow.call(this);
        let line = this.querySelector(".yu-mail-preview");
        if (!line) {
          line = doc.createElement("span");
          line.className = "yu-mail-preview";
          this.querySelector(".thread-card-dynamic-row").append(line);
        }
        line.textContent = "";
        if (this.dataset.properties.split(" ").includes("dummy")) {
          return;
        }
        try {
          const hdr = this.view.getMsgHdrAt(this._index);
          if (!hdr.getStringProperty("preview") &&
              (hdr.folder.server.type !== "imap" || hdr.flags & Ci.nsMsgMessageFlags.Offline)) {
            hdr.folder.fetchMsgPreviewText([hdr.messageKey], null);
          }
          line.textContent = hdr.getStringProperty("preview");
        } catch (error) {}
      };
    });
  }, "document-element-inserted");
}
