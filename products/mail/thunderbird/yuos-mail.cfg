// Yu OS Mail desktop defaults.
if (typeof Components !== "undefined" &&
    Services.appinfo.version.split(".")[0] === "140" &&
    getPref("yuos.mail.chrome.enabled")) {
  defaultPref("mail.uifontsize", 13);
  defaultPref("mail.fixed_width_messages", false);
  defaultPref("mail.openMessageBehavior", 1);
  defaultPref("font.name.sans-serif.x-western", "Noto Sans");
  defaultPref("font.name.sans-serif.x-unicode", "Noto Sans");
  defaultPref("font.name.sans-serif.zh-CN", "Noto Sans CJK SC");

  try {
    const file = Services.dirsvc.get("GreD", Ci.nsIFile);
    file.append("distribution");
    file.append("yuos-mail.css");
    if (!file.isFile()) {
      throw new Error("Missing packaged Yu OS Mail stylesheet");
    }
    const uri = Services.io.newFileURI(file);
    // Compose's CSP only allows chrome: images, so its icons are a chrome package.
    globalThis.yuMailChrome = Cc["@mozilla.org/addons/addon-manager-startup;1"]
      .getService(Ci.amIAddonManagerStartup)
      .registerChrome(uri, [["content", "yuos-mail", "yuos-mail-icons/"]]);
    const styles = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
    if (!styles.sheetRegistered(uri, styles.USER_SHEET)) {
      styles.loadAndRegisterSheet(uri, styles.USER_SHEET);
    }
  } catch (error) {
    Components.utils.reportError(error);
  }

  defaultPref("msgcompose.font_face", "Noto Sans");

  const zh = () => Services.locale.appLocaleAsBCP47.startsWith("zh");
  const T = key => ({
    write: ["写信", "Write"], search: ["搜索邮件", "Search mail"],
    sent: ["已发送", "Sent"], archive: ["归档", "Archive"], drafts: ["草稿", "Drafts"],
    more: ["更多", "More"], moreFormat: ["更多格式", "More formatting"], size: ["字号", "Size"],
    minimize: ["最小化", "Minimize"], maximize: ["最大化", "Maximize"], close: ["关闭", "Close"],
    results: ["搜索结果", "Results"], clear: ["清除搜索", "Clear search"],
  })[key][zh() ? 0 : 1];

  // Minimal default layout; a saved layout other than an earlier Yu OS default wins.
  Services.obs.addObserver(function yuMailToolbars() {
    Services.obs.removeObserver(yuMailToolbars, "final-ui-startup");
    const MAIN = "chrome://messenger/content/messenger.xhtml";
    const COMPOSE = "chrome://messenger/content/messengercompose/messengercompose.xhtml";
    const earlier = [
      JSON.stringify({
        mail: ["write-message", "get-messages", "delete", "archive", "junk", "move-to",
               "reply", "reply-all", "forward-inline", "mark-as", "tag-message", "spacer", "search-bar"],
      }),
      "button-send,separator,button-attach,button-save,spellingButton,button-contacts,spring,button-encryption,button-encryption-options",
      "button-send,separator,button-attach,button-save,spellingButton,button-address,button-contacts,spring,button-encryption,button-encryption-options",
    ];
    const defaults = [
      [MAIN, "unifiedToolbar", "state", JSON.stringify({ mail: ["write-message", "spacer", "search-bar", "spacer"] })],
      [MAIN, "spacesToolbar", "hidden", "true"],
      [COMPOSE, "composeToolbar2", "currentset", "button-send,button-attach,spring"],
      [COMPOSE, "compose-toolbar-menubar2", "autohide", "true"],
    ];
    for (const [doc, id, attr, value] of defaults) {
      if (!Services.xulStore.hasValue(doc, id, attr) ||
          earlier.includes(Services.xulStore.getValue(doc, id, attr))) {
        Services.xulStore.setValue(doc, id, attr, value);
      }
    }
  }, "final-ui-startup");

  Services.obs.addObserver(doc => {
    const win = doc.defaultView;
    const uri = doc.documentURI || "";
    if (uri === "chrome://messenger/content/messenger.xhtml") {
      win.addEventListener("DOMContentLoaded", () => {
        const search = doc.getElementById("searchBarItemTemplate")?.content.querySelector("[slot=placeholder]");
        if (search) {
          search.removeAttribute("data-l10n-id");
          search.classList.remove("kbd-container");
          search.textContent = T("search");
        }
        doc.getElementById("writeMessageTemplate")?.content.firstElementChild.setAttribute("label", T("write"));
        // Search filters the open folder in place instead of opening a Gloda tab.
        const tabmail = doc.getElementById("tabmail");
        const filter = text => {
          const pane = tabmail.currentAbout3Pane;
          const bar = pane?.quickFilterBar;
          if (!bar?.filterer) {
            return;
          }
          const states = bar.filterer.filterValues.text?.states ?? { sender: true, recipients: true, subject: true, body: false };
          bar.filterer.filterValues.text = { states, text: text || null };
          pane.yuSearch = (text || "").toLowerCase();
          pane.document.documentElement.toggleAttribute("yu-search", !!text);
          bar.updateSearch();
        };
        for (const type of ["autocomplete", "search"]) {
          win.addEventListener(type, event => {
            if (event.target.localName === "global-search-bar") {
              event.stopImmediatePropagation();
              event.preventDefault();
              filter(event.detail);
            }
          }, true);
        }
        const style = doc.createElementNS("http://www.w3.org/1999/xhtml", "style");
        style.textContent = `input { padding-inline: 36px 12px !important; font: 13px "Noto Sans", "Noto Sans CJK SC", sans-serif; }
          #clear-button { display: none !important; }`;
        win.addEventListener("focusin", event => {
          const root = event.target.shadowRoot;
          if (event.target.localName === "global-search-bar" && !root.contains(style)) {
            root.append(style);
          }
        }, true);
        const openTab = tabmail.openTab;
        tabmail.openTab = function (type, args) {
          if (type === "glodaFacet") {
            const text = args?.searcher?.searchString;
            if (text) {
              doc.querySelector("global-search-bar")?.overrideSearchTerm(text);
            }
            return null;
          }
          return openTab.apply(this, arguments);
        };
        // Spaces live in the app menu instead of a permanent side bar.
        const view = doc.getElementById("appMenu-mainView");
        view?.addEventListener("ViewShowing", () => {
          const before = doc.getElementById("appmenu_preferences");
          doc.querySelectorAll(".yu-space-item").forEach(item => item.remove());
          for (const space of win.gSpacesToolbar?.spaces ?? []) {
            if (space.name === "settings" || !space.button) {
              continue;
            }
            const item = doc.createXULElement("toolbarbutton");
            item.className = "subviewbutton yu-space-item";
            item.setAttribute("label", space.button.title || space.button.getAttribute("aria-label") || space.name);
            item.addEventListener("command", () => {
              win.PanelUI.hide();
              win.gSpacesToolbar.openSpace(win.document.getElementById("tabmail"), space);
            });
            before.before(item);
          }
        });
      }, { once: true });
    } else if (uri.startsWith("about:3pane")) {
      win.addEventListener("DOMContentLoaded", () => {
        const header = win.threadPaneHeader;
        const count = doc.createElement("span");
        count.className = "thread-pane-count-info yu-count";
        doc.getElementById("threadPaneFolderCount").after(count);
        const update = header.updateMessageCount;
        header.updateMessageCount = function (value) {
          update.call(this, value);
          count.textContent = value;
        };
        const changed = win.quickFilterBar.onMessagesChanged;
        win.quickFilterBar.onMessagesChanged = function () {
          changed.call(this);
          const view = win.gDBView;
          if (!view) {
            return;
          }
          count.textContent = win.yuSearch ? view.numMsgsInView : win.gFolder?.getTotalMessages(false) ?? view.numMsgsInView;
          if (win.yuSearch && view.rowCount && win.threadTree.selectedIndex < 0) {
            win.threadTree.selectedIndex = 0;
          }
        };
        const results = doc.createElement("h2");
        results.className = "list-header-title yu-results";
        results.textContent = T("results");
        doc.getElementById("threadPaneFolderName").after(results);
        const reset = () => win.top.document.querySelector("global-search-bar")?.reset();
        const clear = doc.createElement("button");
        clear.className = "yu-clear-search";
        clear.title = T("clear");
        clear.addEventListener("click", reset);
        doc.querySelector("#threadPaneHeaderBar .list-header-bar-container-start").append(clear);
        // Like Outlook, an opened folder shows its newest message.
        win.addEventListener("folderURIChanged", () => {
          if (win.yuSearch) {
            reset();
          }
          Services.tm.dispatchToMainThread(() => {
            const tree = doc.getElementById("threadTree");
            if (win.gDBView?.rowCount && tree.selectedIndex < 0) {
              tree.selectedIndex = 0;
            }
          });
        });
        win.customElements.whenDefined("folder-tree-row").then(Row => {
          const names = { sent: ["已发送消息", "Sent"], archive: ["归档", "Archives"], drafts: ["Drafts"] };
          const setName = Row.prototype._setName;
          Row.prototype._setName = function () {
            setName.call(this);
            const type = this.dataset.folderType;
            if (this._nameStyle === "folder" && names[type]?.includes(this.name)) {
              this.name = T(type);
            }
          };
          const setType = Row.prototype.setFolderTypeFromFolder;
          Row.prototype.setFolderTypeFromFolder = function (folder) {
            setType.call(this, folder);
            if (this._folderName) {
              this._setName();
            }
          };
          for (const row of doc.querySelectorAll('li[is="folder-tree-row"]')) {
            row._setName();
          }
        });
        win.customElements.whenDefined("thread-card").then(Card => {
          const density = win.threadPane.densityChange;
          win.threadPane.densityChange = async function () {
            await density.call(this);
            Card.ROW_HEIGHT = zh() ? 84 : 78;
          };
          Card.ROW_HEIGHT = zh() ? 84 : 78;
        });
      }, { once: true });
    } else if (uri.startsWith("about:message")) {
      win.addEventListener("DOMContentLoaded", () => {
        // Actions removed from the header stay in its More menu.
        const popup = doc.getElementById("otherActionsPopup");
        const first = popup?.firstElementChild;
        const commands = {
          "mailContext-replyAll": "cmd_replyall",
          "mailContext-markAsJunk": "cmd_markAsJunk",
          "mailContext-markFlagged": "cmd_markAsFlagged",
        };
        for (const id of [...Object.keys(commands), "mailContext-moveMenu"]) {
          const item = doc.getElementById(id)?.cloneNode(true);
          if (!item) {
            continue;
          }
          item.id = "yu-" + id;
          item.querySelectorAll("[id]").forEach(child => (child.id = "yu-" + child.id));
          item.addEventListener("command", event => {
            event.stopPropagation();
            if (commands[id]) {
              win.commandController.doCommand(commands[id]);
            } else if (event.target._folder) {
              win.commandController.doCommand("cmd_moveMessage", event.target._folder);
            }
          });
          popup.insertBefore(item, first);
        }
        popup?.insertBefore(doc.createXULElement("menuseparator"), first);
        popup?.addEventListener("popupshowing", event => {
          if (event.target === popup) {
            const flagged = win.gMessage?.isFlagged;
            doc.getElementById("yu-mailContext-markFlagged")?.setAttribute("checked", !!flagged);
          }
        });
        // The message body sizes to its content so attachments follow it.
        const pane = doc.getElementById("messagepane");
        const fit = (tries = 40) => {
          const page = pane?.contentDocument;
          if (page?.readyState !== "complete") {
            if (tries) {
              win.setTimeout(fit, 50, tries - 1);
            }
            return;
          }
          const body = page.body;
          pane.removeAttribute("flex");
          const style = page.defaultView.getComputedStyle(body);
          const height = body.getBoundingClientRect().height + parseFloat(style.marginTop) + parseFloat(style.marginBottom);
          pane.style.height = Math.min(Math.ceil(height), pane.parentElement.clientHeight) + "px";
        };
        win.addEventListener("MsgLoaded", () => win.setTimeout(fit, 0));
        win.addEventListener("resize", () => fit(0));
      }, { once: true });
    }
  }, "document-element-inserted");

  // Compose: Send and Attach up front, everything else in More; one formatting row.
  Services.obs.addObserver(doc => {
    if (doc.documentURI !== "chrome://messenger/content/messengercompose/messengercompose.xhtml") {
      return;
    }
    const win = doc.defaultView;
    doc.documentElement.setAttribute("customtitlebar", "true");
    win.addEventListener("DOMContentLoaded", () => {
      const $ = id => doc.getElementById(id);
      const palette = $("compose-toolbox").palette;
      const button = (id, cls, tip, command) => {
        const node = doc.createXULElement("toolbarbutton");
        node.id = id;
        node.className = cls;
        node.setAttribute("tooltiptext", tip);
        if (command) {
          node.addEventListener("command", command);
        }
        return node;
      };
      const menu = (node, items) => {
        node.setAttribute("type", "menu");
        const popup = doc.createXULElement("menupopup");
        node.append(popup);
        for (const item of items) {
          popup.append(item);
        }
        return popup;
      };
      const item = (label, command) => {
        const node = doc.createXULElement("menuitem");
        node.setAttribute("label", label);
        node.addEventListener("command", command);
        return node;
      };
      const copy = id => {
        const node = $(id)?.cloneNode(true);
        node?.removeAttribute("id");
        node?.querySelectorAll("[id]").forEach(child => child.removeAttribute("id"));
        if (node && !node.hasAttribute("label") && node.hasAttribute("command")) {
          node.setAttribute("label", $(node.getAttribute("command")).getAttribute("label"));
        }
        return node;
      };

      const toolbar = $("composeToolbar2");
      const action = () => $("yu-mail-ai_yuos_io-composeAction-toolbarbutton");
      const ai = item("", () => action()?.doCommand());
      ai.id = "yu-compose-ai";
      ai.className = "menuitem-iconic";
      const encrypt = item(palette.querySelector("#button-encryption")?.label, () => win.toggleEncryptMessage());
      encrypt.setAttribute("type", "checkbox");
      const more = button("yu-compose-more", "toolbarbutton-1", T("more"));
      const popup = menu(more, [
        item(palette.querySelector("#button-save")?.label, () => win.goDoCommand("cmd_saveDefault")),
        item(palette.querySelector("#spellingButton")?.label, () => win.goDoCommand("cmd_spelling")),
        item(palette.querySelector("#button-contacts")?.label, () => win.toggleContactsSidebar()),
        encrypt,
        doc.createXULElement("menuseparator"),
        ai,
      ]);
      popup.addEventListener("popupshowing", () => {
        const node = action();
        ai.hidden = !node;
        if (node) {
          ai.setAttribute("label", node.label);
          ai.style.listStyleImage = win.getComputedStyle(node).getPropertyValue("--webextension-menupanel-image");
        }
        encrypt.setAttribute("checked", !!win.gSendEncrypted);
      });
      const controls = doc.createXULElement("toolbaritem");
      controls.id = "yu-compose-wc";
      controls.append(
        button("yu-compose-min", "yu-wc", T("minimize"), () => win.minimize()),
        button("yu-compose-max", "yu-wc", T("maximize"), () =>
          win.windowState === win.STATE_MAXIMIZED ? win.restore() : win.maximize()),
        button("yu-compose-close", "yu-wc", T("close"), () => win.goDoCommand("cmd_close")),
      );
      toolbar.append(more, controls);

      // Cc/Bcc sit on the To line; From appears only with several identities.
      $("addressRowTo").append($("extraAddressRowsArea"));
      const { MailServices } = ChromeUtils.importESModule("resource:///modules/MailServices.sys.mjs");
      if (MailServices.accounts.allIdentities.length < 2) {
        doc.documentElement.setAttribute("yu-single-identity", "true");
      }
      doc.documentElement.toggleAttribute("yu-zh", zh());
      win.customElements.whenDefined("mail-recipients-area").then(Area => {
        const create = Area.prototype.createRecipientPill;
        Area.prototype.createRecipientPill = function (element, address) {
          const pill = create.call(this, element, address);
          if (address.name) {
            pill.label = address.name;
            pill.setAttribute("tooltiptext", address.toString());
          }
          return pill;
        };
      });

      const format = $("FormatToolbar");
      for (const box of doc.querySelectorAll(".address-label-container, #subjectLabel-box, #identityLabel-box")) {
        box.removeAttribute("pack");
      }
      // Keep Alt+S without the underlined access key.
      const subjectKey = $("subjectLabel").getAttribute("accesskey").toLowerCase();
      $("subjectLabel").removeAttribute("accesskey");
      win.addEventListener("keydown", event => {
        if (event.altKey && event.key.toLowerCase() === subjectKey) {
          $("msgSubject").focus();
        }
      });
      const faceParts = $("FontFaceSelect").shadowRoot;
      faceParts.querySelector('[part="icon"]').style.display = "none";
      faceParts.querySelector("dropmarker").style.display = "none";
      faceParts.querySelectorAll('[part="label"]').forEach(label => (label.style.margin = "0"));
      const caret = doc.createXULElement("label");
      caret.setAttribute("value", "\u00A0\u25BE");
      caret.style.margin = "0";
      faceParts.querySelector('[part="label-box"]').append(caret);
      // Show only the primary family, not the generic fallbacks native code appends.
      const fontFaceChange = win.onFontFaceChange;
      win.onFontFaceChange = function () {
        fontFaceChange.apply(this, arguments);
        const list = $("FontFaceSelect");
        const current = list.selectedItem;
        if (current?.label.includes(",")) {
          current.label = current.label.split(",")[0];
          list.setAttribute("label", current.label);
        }
      };
      const sep = () => {
        const node = doc.createXULElement("toolbarseparator");
        node.className = "yu-fmt-sep";
        return node;
      };
      const size = button("yu-font-size", "formatting-button", T("size"));
      size.setAttribute("observes", "cmd_renderedHTMLEnabler");
      size.setAttribute("label", "14 \u25BE");
      menu(size, [10, 12, 13, 14, 16, 18, 20, 24, 32].map(px => item(String(px), () => {
        const editor = win.GetCurrentEditor();
        editor.removeInlineProperty("font", "size");
        editor.removeInlineProperty("span", "style");
        if (px !== 14) {
          editor.setInlineProperty("span", "style", `font-size: ${px}px`);
        }
        win.gContentWindow.focus();
      })));
      const link = button("yu-fmt-link", "formatting-button", $("InsertLinkItem").label, () => win.goDoCommand("cmd_link"));
      const image = button("yu-fmt-image", "formatting-button", $("InsertImageItem").label, () => win.goDoCommand("cmd_image"));
      const highlight = item($("BackgroundColorButton").getAttribute("tooltiptext"), () => win.goDoCommand("cmd_backgroundColor"));
      const emoji = doc.createXULElement("menu");
      emoji.setAttribute("label", $("smileButtonMenu").getAttribute("tooltiptext"));
      emoji.append(copy("smileyPopup"));
      const removeLinks = copy("removeLinksMenuitem");
      const formatMore = button("yu-fmt-more", "formatting-button", T("moreFormat"));
      menu(formatMore, [
        copy("paragraphMenu"), copy("fontStyleMenu"), highlight, copy("listMenu"),
        copy("increaseIndent"), copy("decreaseIndent"), doc.createXULElement("menuseparator"),
        copy("tableMenu"), copy("insertHline"), copy("insertChars"), emoji, copy("insertAnchor"),
        copy("insertHTMLSource"), copy("insertMath"), doc.createXULElement("menuseparator"),
        removeLinks, copy("colorsAndBackground"),
      ].filter(Boolean)).addEventListener("popupshowing", () => {
        removeLinks.setAttribute("label", win.GetString(win.GetCurrentEditor().selection.isCollapsed ? "StopLinks" : "RemoveLinks"));
      });
      for (const node of [link, image, formatMore]) {
        node.setAttribute("observes", "cmd_renderedHTMLEnabler");
      }
      const s1 = sep(), s2 = sep(), s3 = sep();
      s1.id = "yu-fmt-sep1";
      s2.id = "yu-fmt-sep2";
      s3.id = "yu-fmt-sep3";
      format.append(size, s1, s2, s3, link, image, formatMore);

      // HTML body: Noto Sans 14px, line height 1.7, carried in the sent message.
      const loadPrefs = win.loadHTMLMsgPrefs;
      win.loadHTMLMsgPrefs = function () {
        loadPrefs.apply(this, arguments);
        const body = win.GetBodyElement();
        // messageQuotes.css resets the body line height with an agent-level !important.
        win.gContentWindow.windowUtils.loadSheetUsingURIString(
          "data:text/css,body{line-height:1.7!important}", win.gContentWindow.windowUtils.AGENT_SHEET);
        if (!body.getAttribute("style")) {
          body.setAttribute("style", 'font-family: "Noto Sans", "Noto Sans CJK SC", sans-serif; font-size: 14px; line-height: 1.7;');
        }
        const sizeLabel = () => {
          const node = win.gContentWindow.getSelection()?.focusNode;
          const element = node?.nodeType === 1 ? node : node?.parentElement;
          if (element) {
            size.setAttribute("label", `${Math.round(parseFloat(win.gContentWindow.getComputedStyle(element).fontSize))} \u25BE`);
          }
        };
        body.ownerDocument.addEventListener("selectionchange", sizeLabel);
      };
    }, { once: true });
  }, "document-element-inserted");

  // No account yet: the window is the account setup page with a short title.
  Services.obs.addObserver(doc => {
    const uri = doc.documentURI || "";
    if (uri === "chrome://messenger/content/messenger.xhtml" || uri.startsWith("about:3pane")) {
      const { MailServices } = ChromeUtils.importESModule("resource:///modules/MailServices.sys.mjs");
      if (MailServices.accounts.accounts.length) {
        return;
      }
      const root = doc.documentElement;
      root.setAttribute("yu-no-account", "true");
      const clear = event => {
        if (!event || (!uri.startsWith("about:3pane") &&
            event.detail?.tabInfo?.browser?.currentURI?.spec === "about:accountsetup")) {
          root.removeAttribute("yu-no-account");
          doc.defaultView.removeEventListener("TabClose", clear, true);
          // Removing inside onServerLoaded mutates the array Thunderbird is iterating.
          Services.tm.dispatchToMainThread(() => MailServices.accounts.removeIncomingServerListener(listener));
        }
      };
      const listener = { onServerLoaded: () => clear(), onServerUnloaded() {}, onServerChanged() {} };
      MailServices.accounts.addIncomingServerListener(listener);
      doc.defaultView.addEventListener("TabClose", clear, true);
    } else if (uri.startsWith("about:accountsetup")) {
      doc.defaultView.addEventListener("DOMContentLoaded", () => {
        const title = doc.getElementById("accountSetupTitle");
        if (title?.getAttribute("data-l10n-id") === "account-setup-title") {
          doc.l10n.setAttributes(title, "account-setup-tab-title");
        }
      }, { once: true });
    }
  }, "document-element-inserted");

  // Cards show Thunderbird's stored message preview as a third line.
  Services.obs.addObserver(doc => {
    if (!doc.documentURI?.startsWith("about:3pane")) {
      return;
    }
    doc.defaultView.customElements.whenDefined("thread-card").then(Card => {
      const fillRow = Card.prototype._fillRow;
      Card.prototype._fillRow = function () {
        fillRow.call(this);
        let line = this.querySelector(".yu-mail-preview");
        if (!line) {
          line = doc.createElement("span");
          line.className = "yu-mail-preview";
          this.querySelector(".thread-card-dynamic-row").append(line);
        }
        line.textContent = "";
        if (this.dataset.properties.split(" ").includes("dummy")) {
          return;
        }
        try {
          const hdr = this.view.getMsgHdrAt(this._index);
          if (!hdr.getStringProperty("preview") &&
              (hdr.folder.server.type !== "imap" || hdr.flags & Ci.nsMsgMessageFlags.Offline)) {
            hdr.folder.fetchMsgPreviewText([hdr.messageKey], null);
          }
          line.textContent = hdr.getStringProperty("preview");
        } catch (error) {}
        const query = doc.defaultView.yuSearch;
        if (query) {
          for (const el of [this.senderLine, this.subjectLine, line]) {
            const text = el.textContent;
            const parts = [];
            let at = 0;
            for (let i = text.toLowerCase().indexOf(query); i >= 0; i = text.toLowerCase().indexOf(query, at)) {
              const hit = doc.createElement("span");
              hit.className = "yu-hit";
              hit.textContent = text.slice(i, i + query.length);
              parts.push(text.slice(at, i), hit);
              at = i + query.length;
            }
            if (parts.length) {
              el.replaceChildren(...parts, text.slice(at));
            }
          }
        }
      };
    });
  }, "document-element-inserted");
}
