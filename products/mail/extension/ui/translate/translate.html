<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../lib/ui.css">
  <link rel="stylesheet" href="translate.css">
  <title data-i18n="translate_title">Translate</title>
</head>
<body class="popup translate-popup">

  <header class="popup-header">
    <h1 data-i18n="translate_title">Translate</h1>
    <button class="ghost icon-button" id="btn-refresh" data-i18n-title="action_refresh" title="Refresh">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor"
           stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9L13.5 5.7m0-3.5v3.5H10"/>
      </svg>
    </button>
  </header>

  <div class="row">
    <label for="target" data-i18n="label_target_language">Target language</label>
    <select id="target" class="grow">
      <option>English</option>
      <option>简体中文</option>
      <option>繁體中文</option>
      <option>Español</option>
      <option>Français</option>
      <option>Deutsch</option>
      <option>日本語</option>
      <option>한국어</option>
      <option>Português</option>
      <option>Русский</option>
      <option>العربية</option>
      <option>Italiano</option>
      <option>Nederlands</option>
      <option>Polski</option>
      <option>हिन्दी</option>
    </select>
    <button class="primary" id="btn-translate" data-i18n="action_translate">Translate</button>
  </div>

  <label for="source" data-i18n="label_source_text">Source</label>
  <textarea id="source" rows="4" data-i18n-placeholder="ph_source"></textarea>

  <div id="out"></div>


  <script src="../../lib/ui.js"></script>
  <script src="../../lib/messages.js"></script>
  <script src="translate.js"></script>
</body>
</html>
