<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../lib/ui.css">
  <link rel="stylesheet" href="summarize.css">
  <title data-i18n="summarize_title">Summarize</title>
</head>
<body class="popup summarize-popup">

  <header class="popup-header">
    <h1 data-i18n="summarize_title">Summarize</h1>
    <button class="ghost icon-button" id="btn-refresh" data-i18n-title="action_refresh" title="Refresh">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor"
           stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9L13.5 5.7m0-3.5v3.5H10"/>
      </svg>
    </button>
  </header>

  <div id="meta" class="muted mono"></div>

  <div id="out"></div>

  <div class="footer-row">
    <button class="ghost" id="btn-copy" data-i18n="action_copy">Copy</button>
    <button class="ghost" id="btn-open-assistant" data-i18n="action_open_assistant">Open Assistant</button>
  </div>

  <div id="usage" class="usage-line"></div>

  <script src="../../lib/ui.js"></script>
  <script src="../../lib/messages.js"></script>
  <script src="summarize.js"></script>
</body>
</html>
