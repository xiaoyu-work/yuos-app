<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendar</title><link rel="stylesheet" href="shared/ui.css"><link rel="stylesheet" href="calendar.css"></head><body>
<svg class="symbols" aria-hidden="true">
<symbol id="i-left" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
<symbol id="i-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-invite" viewBox="0 0 24 24"><circle cx="10" cy="8.5" r="3.5"/><path d="M3.5 19.5c.6-3.4 3.2-5.5 6.5-5.5 1.6 0 3 .5 4.1 1.3M18 13v6M15 16h6"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4"/></symbol>
<symbol id="i-pen" viewBox="0 0 24 24"><path d="m14.5 5.5 4 4L8 20H4v-4z"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V5h5v2M6.5 7l.8 12a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4l.8-12M10 11v6M14 11v6"/></symbol>
<symbol id="i-reply" viewBox="0 0 24 24"><path d="M9.5 7 4.5 12l5 5M4.5 12h9a6 6 0 0 1 6 6"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r=".9"/><circle cx="12" cy="12" r=".9"/><circle cx="18" cy="12" r=".9"/></symbol>
<symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18.5h10a4 4 0 0 0 .6-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 7 18.5"/></symbol>
<symbol id="i-device" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="1.5"/><path d="M9 20h6M12 16.5V20"/></symbol>
<symbol id="i-today" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><circle cx="12" cy="14.5" r="1.6"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
<symbol id="i-maybe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.8 9.6a2.3 2.3 0 0 1 4.4.9c0 1.6-2.2 2-2.2 3.3M12 16.6h.01"/></symbol>
<symbol id="i-declined" viewBox="0 0 24 24"><path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/></symbol>
<symbol id="i-pending" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
</svg>
<div class="cal-app" id="app">
<aside class="side">
<div class="mini"><div class="mini-head"><span id="mini-title"></span>
<button id="mini-previous" class="icon" data-label="previous"><svg><use href="#i-left"/></svg></button>
<button id="mini-next" class="icon" data-label="next"><svg><use href="#i-right"/></svg></button></div>
<div id="mini" class="mini-grid"></div></div>
<div class="section"><svg><use href="#i-down"/></svg><span data-text="calendars"></span></div>
<div id="providers" class="providers" role="radiogroup"></div>
<select id="provider" hidden><option value="local">Local calendar</option><option value="google">Google</option><option value="outlook">Outlook</option></select>
</aside>
<section class="main">
<div class="bar"><h2 id="month" class="title"></h2>
<button id="previous" class="icon" data-label="previous"><svg><use href="#i-left"/></svg></button>
<button id="today" class="text bordered" data-text="today"></button>
<button id="next" class="icon" data-label="next"><svg><use href="#i-right"/></svg></button>
<p id="app-label" class="app-label" data-app-label hidden></p>
<span class="flex"></span>
<button id="refresh" class="icon" data-label="refresh"><svg><use href="#i-refresh"/></svg></button>
<span class="separator"></span>
<button id="invite" class="text" hidden><svg><use href="#i-invite"/></svg><span data-text="invite"></span></button>
<button id="create" class="text primary"><svg><use href="#i-plus"/></svg><span data-text="newEvent"></span></button>
<div class="menu-anchor"><button id="more-button" class="icon" data-label="moreTools" aria-haspopup="menu" aria-expanded="false"><svg><use href="#i-more"/></svg></button>
<div id="more" class="menu" role="menu" hidden></div></div></div>
<div id="weekdays" class="weekdays"></div>
<div id="calendar" class="calendar"></div>
<footer class="foot"><span id="status"></span><span class="flex"></span><p id="notice" class="notice" role="status"></p></footer>
</section>
<aside class="inspector">
<div class="inspector-scroll">
<div class="day-head"><h3 id="day-title"></h3><span id="day-count"></span></div>
<div id="agenda" class="agenda"></div>
<div class="rule"></div>
<div id="details" class="details"></div>
</div>
<div id="event-actions" class="event-actions" hidden></div>
</aside>
</div>
<script src="shared/client.js"></script><script src="shared/ui.js"></script><script src="app.js"></script>
</body></html>
