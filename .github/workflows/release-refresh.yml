name: Refresh authenticated App APT metadata

on:
  schedule:
    - cron: "23 6 * * 1,4"
  workflow_dispatch:
    inputs:
      landing_only:
        description: "Deploy the landing page before the first signed App release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-apt-publication
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && !inputs.landing_only
    runs-on: ubuntu-24.04
    environment: app-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Configure authenticated Git transport
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git --hostname github.com
      - name: Verify retained content and renew its bounded signed metadata
        env:
          GH_TOKEN: ${{ github.token }}
          YUOS_APPS_REPO_SETTINGS_TOKEN: ${{ secrets.YUOS_APPS_REPO_SETTINGS_TOKEN }}
          YUOS_APPS_APT_SIGNING_PRIVATE_KEY: ${{ secrets.YUOS_APPS_APT_SIGNING_PRIVATE_KEY }}
          YUOS_APPS_APT_SIGNING_PASSPHRASE: ${{ secrets.YUOS_APPS_APT_SIGNING_PASSPHRASE }}
        run: python3 tools/release_publish.py refresh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/apt-publication

  landing:
    if: github.ref == 'refs/heads/main' && inputs.landing_only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Confirm there is no signed App release to replace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          from release_publish import GitHub, assert_initial_publication

          github = GitHub()
          branch = github.settings["state_branch"]
          status, _ = github.api(f"git/ref/heads/{branch}", allowed=(200, 404))
          if status != 404:
              raise SystemExit("The signed APT state already exists; use authenticated refresh")
          assert_initial_publication(github)
          PY
          install -Dm0644 packaging/apt/landing.html build/apt-landing/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/apt-landing

  deploy:
    needs: [refresh, landing]
    if: ${{ !cancelled() && !failure() && (needs.refresh.result == 'success' || needs.landing.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
