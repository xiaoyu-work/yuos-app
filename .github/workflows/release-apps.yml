name: Release selected applications

on:
  workflow_dispatch:
    inputs:
      select:
        description: "Comma-separated products, capability:<name>, support, sets; or all"
        required: false
        default: "all"
        type: string
      version:
        description: "MAJOR.MINOR.PATCH.devYYYYMMDDNN (leave empty to auto-compute like SDK)"
        required: false
        default: ""
        type: string
      initialize:
        description: "First publication only; refuses an existing or lost APT channel"
        default: false
        type: boolean
      fixtures:
        description: "Also publish optional complete source/staging fixture archives"
        default: false
        type: boolean
      build_only:
        description: "Build and validate packages without signing, releases or APT publication"
        default: false
        type: boolean
      publisher_key_id:
        description: "Trusted App package Ed25519 publisher key ID (sha256:...); defaults to YUOS_APPS_PROVENANCE_PUBLISHER_JSON"
        type: string
  workflow_call:
    inputs:
      select:
        required: false
        default: "all"
        type: string
      version:
        required: false
        default: ""
        type: string
      initialize:
        default: false
        type: boolean
      fixtures:
        default: false
        type: boolean
      build_only:
        default: false
        type: boolean
      publisher_key_id:
        type: string
    secrets:
      YUOS_APPS_APT_SIGNING_PRIVATE_KEY:
        required: true
      YUOS_APPS_APT_SIGNING_PASSPHRASE:
        required: true
      YUOS_APPS_PROVENANCE_SIGNING_PRIVATE_KEY:
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: app-apt-publication
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTION: ${{ inputs.select || 'all' }}
          RELEASE_VERSION: ${{ inputs.version }}
          INCLUDE_FIXTURES: ${{ inputs.fixtures }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          if [ -z "$version" ] || [ "$version" = "auto" ]; then
            build_day="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at[:10]')"
            day="${build_day//-/}"
            base="0.1.0"
            seq=1
            while [ -n "$(git ls-remote --tags origin "refs/tags/yuos-*-v$(printf '%s.dev%s%02d' "$base" "$day" "$seq")")" ]; do
              seq=$((seq + 1))
            done
            version="$(printf '%s.dev%s%02d' "$base" "$day" "$seq")"
          fi
          echo "Computed App release version: $version"
          args=()
          if [ "$INCLUDE_FIXTURES" = true ]; then args+=(--fixtures); fi
          matrix=$(python3 tools/release.py plan --select "$SELECTION" --version "$version" "${args[@]}")
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-plan
          path: build/release-plan.json
          if-no-files-found: error

  contracts:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: app-release-plan
          path: build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 tools/release_ci.py test --plan build/release-plan.json
      - name: Test selected App contracts and isolated release transactions
        run: |
          export TMPDIR="$PWD/build/ci-work"
          python3 tools/release.py test --plan build/release-plan.json --architecture all
          python3 -m pytest -q tests/release --basetemp=build/release-tests

  build:
    needs: [plan, contracts]
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Bootstrap the declared Debian build container
        run: apt-get update -qq && apt-get install --no-install-recommends -y git ca-certificates python3
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: app-release-plan
          path: build
      - name: Trust the exact host-mounted checkout inside the build container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 tools/release_ci.py build --plan build/release-plan.json --architecture "$ARCHITECTURE"
      - if: matrix.architecture != 'all'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Test the selected native products
        if: matrix.architecture != 'all'
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          export TMPDIR="$PWD/build/ci-work"
          python3 tools/release.py test --plan build/release-plan.json --architecture "$ARCHITECTURE"
      - name: Build real installable App payloads
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          export TMPDIR="$PWD/build/ci-work"
          python3 tools/release.py build --plan build/release-plan.json --architecture "$ARCHITECTURE"
      - uses: actions/upload-artifact@v4
        with:
          name: app-debs-${{ matrix.architecture }}
          path: |
            build/release/*.deb
            build/release/yuos-app-development-*.tar.xz
            build/release/yuos-app-interfaces-*.tar.gz
            build/release/build-record-*.json
          if-no-files-found: error

  publish:
    needs: [plan, contracts, build]
    if: ${{ !inputs.build_only }}
    runs-on: ubuntu-24.04
    environment: app-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: app-release-plan
          path: build
      - uses: actions/download-artifact@v4
        with:
          pattern: app-debs-*
          path: build/release
          merge-multiple: true
      - name: Configure authenticated Git transport
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c "import cryptography" 2>/dev/null || (sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y python3-cryptography)
          gh auth setup-git --hostname github.com
      - name: Publish immutable assets and verify the retained App APT snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          YUOS_APPS_REPO_SETTINGS_TOKEN: ${{ secrets.YUOS_APPS_REPO_SETTINGS_TOKEN }}
          YUOS_APPS_APT_SIGNING_PRIVATE_KEY: ${{ secrets.YUOS_APPS_APT_SIGNING_PRIVATE_KEY }}
          YUOS_APPS_APT_SIGNING_PASSPHRASE: ${{ secrets.YUOS_APPS_APT_SIGNING_PASSPHRASE }}
          INITIALIZE: ${{ inputs.initialize }}
          PROVENANCE_KEY_ID: ${{ inputs.publisher_key_id }}
          PROVENANCE_PUBLISHER: ${{ vars.YUOS_APPS_PROVENANCE_PUBLISHER_JSON }}
          YUOS_APPS_PROVENANCE_SIGNING_PRIVATE_KEY: ${{ secrets.YUOS_APPS_PROVENANCE_SIGNING_PRIVATE_KEY }}
        run: |
          publisher_key_id=$(env -u YUOS_APPS_REPO_SETTINGS_TOKEN python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from release_common import config
          from release_publish import require_publication_contract
          from release_snapshots import validate_publisher_trust
          require_publication_contract(config())
          publisher = json.loads(os.environ["PROVENANCE_PUBLISHER"])
          requested_key_id = os.environ.get("PROVENANCE_KEY_ID", "").strip() or None
          key_id = validate_publisher_trust(publisher, requested_key_id)
          trust = Path("build/provenance-publisher.json")
          trust.parent.mkdir(parents=True, exist_ok=True)
          trust.write_text(json.dumps(publisher))
          key = Path("build/provenance-signing-key.json")
          descriptor = os.open(key, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "w") as output:
              output.write(os.environ.pop("YUOS_APPS_PROVENANCE_SIGNING_PRIVATE_KEY"))
          print(key_id)
          PY
          )
          unset YUOS_APPS_PROVENANCE_SIGNING_PRIVATE_KEY
          trap 'rm -f build/provenance-signing-key.json' EXIT
          args=()
          if [ "$INITIALIZE" = true ]; then args+=(--initialize); fi
          python3 tools/release_publish.py publish --plan build/release-plan.json \
            --artifacts build/release "${args[@]}" \
            --publisher-key-id "$publisher_key_id" \
            --publisher-trust build/provenance-publisher.json \
            --app-signing-key build/provenance-signing-key.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/apt-publication

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified APT snapshot
        id: deployment
        uses: actions/deploy-pages@v4
