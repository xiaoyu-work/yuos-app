[package]
name = "yuos-sdk"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Official Rust SDK for Yu OS Apps: manifest-bound MCP tools, gated AI, desktop integration, and public OS services."
repository = "https://github.com/xiaoyu-work/Yu-OS"
homepage = "https://github.com/xiaoyu-work/Yu-OS/tree/main/yuos-sdk"
documentation = "https://docs.rs/yuos-sdk"
readme = "README.md"
keywords = ["yuos", "sdk", "rpc", "policy", "agent"]
categories = ["api-bindings", "os"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
num-bigint = "0.4"
num-traits = "0.2"
regex = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
