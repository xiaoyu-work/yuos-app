[package]
name = "yuos-notification-presentation"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Versioned, renderer-independent notification presentation contract for Yu OS Apps"
repository = "https://github.com/xiaoyu-work/Yu-OS"
readme = "README.md"

[features]
default = []
dbus = ["dep:zbus"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zbus = { version = "5.5", default-features = false, features = ["tokio", "p2p"], optional = true }
